<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>目录筛选与东方珠作 · 产品原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e5de;color:#244c44;font:15px/1.6 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #d9ddd5;border-radius:10px;background:#fffdf8;color:inherit;padding:8px 12px}button[aria-pressed=true]{background:#244c44;color:white}button:disabled{opacity:.35;cursor:default}.intro{max-width:1060px;margin:28px auto 20px;padding:0 20px}.intro h1{font:30px/1.3 Georgia,serif;margin-bottom:8px}.intro p{color:#6b776f}.switch{display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1060px;margin:auto;display:grid;grid-template-columns:minmax(300px,460px) 1fr;gap:32px;padding:0 20px 32px}.phone{background:#f6f3ec;border:1px solid #cfcfc6;border-radius:22px;overflow:hidden;height:min(780px,calc(100vh - 215px));min-height:620px;display:flex;flex-direction:column;box-shadow:0 16px 30px #20392a12}header{padding:16px;text-align:center;border-bottom:1px solid #dedfd6;font:22px Georgia,serif}.filters{padding:12px;display:flex;gap:8px;overflow:auto;flex:none}.filters button{white-space:nowrap}.children{padding:8px 12px;background:#eeeee5;display:flex;gap:6px;flex-wrap:wrap}.children:empty{display:none}.children button{font-size:13px}.region{padding:12px;color:#6b776f;border-bottom:1px solid #dedfd6}.results{padding:12px;flex:1;overflow:auto}.card{padding:18px;background:#fffdf8;border:1px solid #e1e2da;border-radius:12px;margin-bottom:12px}.card h3{margin:0 0 8px}.card p{margin:0;color:#778078}.note{padding:20px;background:#fffdf8;border-radius:14px;height:fit-content}.note h2{font-size:20px}.note li{margin-bottom:10px}.stage{margin:10px 10px 0;border:1px solid #dedfd6;border-radius:12px;overflow:hidden}.stage-info{padding:8px 12px;display:flex;justify-content:space-between;background:#fffdf8}.preview{height:260px;position:relative;background:#eee9dd}.preview svg{width:100%;height:100%}.history{position:absolute;right:8px;bottom:8px;display:flex;background:#fffdf8;border-radius:10px}.history button{border:0;background:none;font-size:13px}.material-panel{margin:10px;flex:1;min-height:0;border:1px solid #dedfd6;border-radius:12px;overflow:hidden;background:#fffdf8;display:flex;flex-direction:column}.search{padding:10px;border-bottom:1px solid #dedfd6}.search input{width:100%;padding:8px;border:1px solid #dedfd6;border-radius:8px;background:#f6f3ec}.browse{display:flex;min-height:0;flex:1}.rail{width:68px;flex:none;overflow:auto;background:#f6f3ec}.rail button{display:block;border:0;border-radius:0;width:100%;background:none;font-size:13px}.rail button[aria-pressed=true]{background:#e1e6dc;color:#244c44;border-left:3px solid #244c44}.materials{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;padding:8px}.material{min-height:120px;align-content:start;display:grid;justify-items:start;background:#f6f3ec;text-align:left;font-size:13px}.bead{width:38px;height:38px;border-radius:50%;margin:3px auto 8px;box-shadow:inset -8px -7px 10px #0003,0 3px 4px #0002}.material small{color:#8c683c}footer{padding:12px;background:#fffdf8;border-top:1px solid #dedfd6;display:flex;gap:8px;align-items:center}footer strong{margin-right:auto;font-size:22px;color:#8c683c}footer button:last-child{background:#244c44;color:#fff}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr;max-width:500px}.phone{height:760px}.intro{max-width:500px}}
</style>
<div class="intro"><h1>目录筛选与东方珠作</h1><p>产品原型 · 示例数据 · 点击标签、材料或撤销按钮体验交互</p><nav class="switch"><button data-page="temple" aria-pressed="true">找寺院</button><button data-page="master">找师傅</button><button data-page="diy">东方珠作</button></nav></div>
<main class="layout"><section id="directory" class="phone"><header id="title">找寺院</header><div id="parents" class="filters" role="group" aria-label="信仰分类"></div><div id="children" class="children" role="group" aria-label="宗派与信俗"></div><div class="region">全部地区　大陆　香港　澳门　台湾</div><div id="results" class="results"></div></section>
<section id="diy" class="phone hidden"><header>东方珠作</header><div class="stage"><div class="stage-info"><span>我的手串 <small id="count"></small></span><span>手围 16 cm ›</span></div><div class="preview"><svg viewBox="0 0 400 260" aria-label="手串预览"><ellipse cx="200" cy="130" rx="94" ry="83" fill="none" stroke="#c2a67f" stroke-width="2"/><g id="beads"></g></svg><div class="history"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button></div></div></div><div class="material-panel"><div class="search"><input id="search" placeholder="搜索材质或规格" aria-label="搜索材料"></div><div class="browse"><nav class="rail" id="rail" aria-label="材料分类"></nav><div id="materials" class="materials"></div></div></div><footer><strong id="price">¥ 0.00</strong><button onclick="alert('原型仅演示页面；正式保存使用现有登录与云端保存流程。')">保存设计</button><button onclick="alert('正式产品进入定制订单流程。')">去定制 →</button></footer></section>
<aside class="note"><h2 id="note-title">先选类型，再选宗派</h2><ol id="notes"></ol><p><a href="../../目录筛选与DIY编辑器产品原型方案.md">查看完整页面规格与验收标准</a></p></aside></main>
<script>
const groups={'汉传佛教':['禅宗','净土宗','天台宗','华严宗'],'藏传佛教':['格鲁派','宁玛派','噶举派','萨迦派'],'南传佛教':['上座部传统'],'道教':['全真派','正一派'],'民间信仰':['妈祖 / 天后','关帝信俗','城隍信俗','王爷信俗','福德正神','保生大帝','哪吒信俗','洪圣信俗','黄大仙信俗','九皇爷信俗','大伯公信俗','拿督公信俗','三山国王']};
let page='temple',parent='',child='',category='全部',selected=[],undo=[],redo=[];
const materials=[['小叶紫檀圆珠','主珠',28,'#74382f'],['星月菩提','主珠',18,'#d8ca94'],['凤眼菩提','主珠',22,'#9a6a45'],['白玉','主珠',35,'#d3d6c6'],['青金石','主珠',25,'#1848ac'],['藏银三通','三通',48,'#8e918b'],['黄铜隔珠','隔珠',8,'#b9a16a'],['平安吊坠','吊坠',32,'#607b6b']];
const el=id=>document.getElementById(id);function button(text,active,action){const b=document.createElement('button');b.textContent=text;b.setAttribute('aria-pressed',active);b.onclick=action;return b}
function renderDirectory(){el('parents').replaceChildren(...['',...Object.keys(groups)].map(name=>button(name||'全部',name===parent,()=>{if(parent!==name)child='';parent=name;renderDirectory()})));el('children').replaceChildren(...(parent?['',...groups[parent]].map(name=>button(name||'全部'+parent,name===child,()=>{child=name;renderDirectory()})):[]));el('results').innerHTML=`<div class="card"><h3>${page==='temple'?'示例寺院':'示例师傅'}</h3><p>${parent||'全部类型'}${child?' · '+child:''}</p><p>该区域显示匹配的列表结果</p></div>`;}
function showPage(name){page=name;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===name));el('directory').classList.toggle('hidden',name==='diy');el('diy').classList.toggle('hidden',name!=='diy');el('title').textContent=name==='master'?'找师傅':'找寺院';el('note-title').textContent=name==='diy'?'围绕预览完成编辑':'先选类型，再选宗派';el('notes').innerHTML=(name==='diy'?['撤销与重做位于预览窗右下角。','移除常驻暂存成功提示、操作提示栏和珠子顺序条。','材料分类竖排，结果区独立滚动。','正式产品选中珠子后，通过菜单复制、删除、换位；草稿仍自动保存。']:['点击类型，在下方展开所属宗派与信俗。','切换类型时清除原子项，保留地区等独立筛选。','选择“全部当前类型”只清除子项；顶层“全部”清除两级选择。','找寺院和找师傅使用相同规则与服务端归属。']).map(t=>'<li>'+t+'</li>').join('');renderDirectory();}
function renderDiy(){el('count').textContent=selected.length+' / 60 颗';el('price').textContent='¥ '+selected.reduce((sum,i)=>sum+materials[i][2],0).toFixed(2);el('undo').disabled=!undo.length;el('redo').disabled=!redo.length;el('beads').innerHTML=selected.map((m,i)=>{const angle=i*2*Math.PI/Math.max(selected.length,12)-Math.PI/2;return `<circle cx="${200+94*Math.cos(angle)}" cy="${130+83*Math.sin(angle)}" r="13" fill="${materials[m][3]}" stroke="#0002"/>`}).join('');el('rail').replaceChildren(...['全部','主珠','隔珠','佛头','三通','吊坠','流苏','绳线'].map(c=>button(c,c===category,()=>{category=c;renderDiy()})));el('materials').replaceChildren(...materials.flatMap((m,i)=>{if(category!=='全部'&&m[1]!==category||!m[0].includes(el('search').value))return [];const b=document.createElement('button');b.className='material';b.innerHTML=`<span class="bead" style="background:${m[3]}"></span>${m[0]}<small>¥${m[2].toFixed(2)}　＋</small>`;b.onclick=()=>{if(selected.length===60)return;undo.push([...selected]);redo=[];selected.push(i);renderDiy()};return[b]}));}
el('undo').onclick=()=>{redo.push([...selected]);selected=undo.pop();renderDiy()};el('redo').onclick=()=>{undo.push([...selected]);selected=redo.pop();renderDiy()};el('search').oninput=renderDiy;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));showPage('temple');renderDiy();
</script></html>
