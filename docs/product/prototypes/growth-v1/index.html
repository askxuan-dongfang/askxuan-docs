function account(){const i=state.level-1,next=thresholds[i+1],min=thresholds[i],total=state.total;return `<div class="card tint"><div class="row"><span class="tag">L${state.level} · ${t(names[i])}</span><span>${t('成长值')}</span></div><div class="big">${total.toLocaleString()}</div><progress aria-label="成长进度" value="${next?Math.max(0,total-min):1}" max="${next?next-min:1}"></progress><div class="row"><small>${next?t('距下一级还差')+' '+Math.max(0,next-total).toLocaleString():t('已达最高等级')}</small><small>${t('待入账')} +${293+(state.order?.growthStatus==='pending'?state.order.growth:0)}</small></div></div>`}
function quote(){const i=state.level-1,level=Math.floor(20000*(10000-goods[i])/10000)+Math.floor(10000*(10000-services[i])/10000),coupon=[0,500,1000,2000,2000][i];let kind=state.scheme,discount=0;if(kind==='best')kind=coupon>level?'coupon':'level';discount=kind==='coupon'?coupon:kind==='level'?level:0;return {discount,pay:33000-discount,growth:Math.floor((30000-discount)/100),kind}}
function orderSnapshot(){const q=quote();return state.order||{...q,level:state.level,growthStatus:q.growth<=state.total?'credited':'pending'}}

let html='';if(state.status==='loading')html=`<p role="status">${t('正在读取成长记录')}</p><div class="skeleton"></div><div class="skeleton"></div>`;else if(state.status==='error')html=`<div class="card"><h2>${t('暂时无法读取')}</h2>${button('重试','retry','primary full')}</div>`;else if(state.status==='guest'&&(state.page<4||state.page>=9))html=`<div class="card tint"><h2>${t('登录查看成长等级')}</h2><p>${t('登录后，各端共享你的成长记录')}</p>${button('模拟登录','login','primary full')}</div>${button('阅读五级规则','rules','full')}`;else{
if(state.status==='refund'&&state.page<5)html+=`<div class="card"><strong class="danger">${state.refundPending?t('退款完成'):t('退款扣回')+' −'+state.refundAmount}</strong><p>${state.refundPending?t('待入账成长已取消，已入账成长保持不变'):t('原订单实付已退回，成长值同步扣回')}</p></div>`;
switch(state.page){
case 0:html+=`<div class="row"><h2>${t('用户')} · 001</h2><span class="tag">${t('原型演示')}</span></div>`+account()+button('查看成长','center','primary full')+`<div class="tabs">${button('积分','hint')}${button('钱包','hint')}${button('服务进度','hint')}</div><div class="stack">${button('订单中心','orders')}${button('收货地址','addresses')}</div>`;break;
case 1:html+=account()+`<div class="tabs">${button('任务','tasks')}${button('权益','rules')}${button('记录','records')}</div><div class="card"><h3>${t('精选学习')}</h3><p>+3 / ${state.lang==='hant'?'日':'日'}</p>${button('去完成','tasks','full')}</div>`;break;
case 2:html+=`<h2>${t('成长任务')}</h2><p class="muted">${t('本月任务成长值')} ${state.monthlyEarned} / 200</p><div class="card">`+['完善资料','精选学习','当天成长记录','官方活动','如实评价'].map((x,i)=>`<div class="listrow row"><div><strong>${t(x)}</strong><small style="display:block">+${[20,3,2,20,5][i]} · ${['仅一次','每日一次','每日一次','每月两次','每月四次'][i]}</small></div>${button(state.done.has(i)?'已完成':'演示完成','task:'+i,state.done.has(i)?'':'primary')}</div>`).join('')+`</div><label for="note">${t('个人记录默认私密')}</label><textarea id="note" rows="3" placeholder="${t('记录一件今天完成的小事')}"></textarea>${button('保存记录','task:2','full')}`;break;
case 3:html+=account()+`<div class="card">`+[['商品消费','+194','已入账'],['订单观察期','+293','待观察'],state.status==='refund'&&state.refundPending?['取消待入账','0','已取消待入账']:['退款扣回','−'+(state.status==='refund'?state.refundAmount:300),'已入账'],['有效评价','+5','已入账']].concat(state.order?.growthStatus==='pending'?[['新订单观察期','+'+state.order.growth,'待观察']]:[]).map((r,i)=>`<div class="listrow"><div class="row"><strong>${t(r[0])}</strong><b class="${i===2?'danger':''}">${r[1]}</b></div><div class="row"><small>2026-10-19 · ${t(r[2])}</small>${button('订单快照','order')}</div></div>`).join('')+'</div>';break;
case 4:html+=`<h2>${t('五级成长')}</h2>`+names.map((n,i)=>`<div class="card ${i+1===state.level?'tint':''}"><div class="row"><h3>L${i+1} ${t(n)}</h3><small>${thresholds[i].toLocaleString()}+</small></div><p>${t('指定商品')} ${(goods[i]/1000).toFixed(1)} 折 · ${t('参与服务')} ${(services[i]/1000).toFixed(1)} 折</p><small>${t(['成长档案','等级徽章','月度成长回顾','平台客服优先分流','年度数字纪念卡'][i])}</small></div>`).join('')+`<div class="card"><h3>${t('升级礼券')}</h3>${[2,3,4,5].map((l,i)=>`<p>L${l} · 满${[100,200,300,500][i]}减${[5,10,20,50][i]} · 30天有效</p>`).join('')}${button('查看适用项目','checkout','primary full')}</div>`;break;
case 5:{const q=quote();html+=`<h2>${t('确认支付')}</h2><div class="card">`+[['商品及材料',20000],['固定服务',10000],['运费',1000],['随喜',2000]].map(([s,n])=>`<div class="row listrow"><span>${t(s)}</span><span>${money(n)}</span></div>`).join('')+'</div><div class="stack">'+[['level','等级优惠'],['coupon','单张礼券'],['normal','正常价']].map(([k,s])=>`<button class="${q.kind===k?'chosen':''}" data-scheme="${k}" ${k==='coupon'&&state.level<2?'disabled':''}>${t(s)}</button>`).join('')+`</div><div class="card" style="margin-top:16px"><div class="row"><span>${t('本单优惠')}</span><strong>−${money(q.discount)}</strong></div><div class="row"><span>${t('应付金额')}</span><strong class="big">${money(q.pay)}</strong></div><p>${t('预计成长值')} +${q.growth}</p><small>${t('完成后满7天且无进行中售后入账')}</small></div>${button('确认示例支付','paid','primary full')}`;break;}
case 6:{const q=orderSnapshot();html+=`<span class="tag">${t('订单快照')}</span><h2>EXAMPLE-001</h2><div class="card"><div class="row"><span>L${q.level} · growth-v1</span><strong>${money(q.pay)}</strong></div><p>${t('平台承担优惠')} ${money(q.discount)}</p><p>${t(q.growthStatus==='credited'?'已入账':q.growthStatus==='refunded'?'退款扣回':q.growthStatus==='cancelled'?'已取消待入账':'待入账')} ${q.growthStatus==='cancelled'?'0':(q.growthStatus==='refunded'?'−':'+')+q.growth}</p></div><div class="stack">${button('查看成长记录','records')}${['cancelled','refunded'].includes(q.growthStatus)?'<p>'+t('已退款')+'</p>':button('模拟退款完成','refund')}</div>`;break;}
case 7:html+=`<h2>${t('服务参与')}</h2><div class="card"><div class="row"><h3>${t('固定服务费')}</h3><span class="tag">${t('参与中')}</span></div><table><tr><th>${t('原销售金额')}</th><th>${t('平台承担优惠')}</th><th>${t('合同应得')}</th></tr><tr><td>¥100.00</td><td>¥5.00</td><td>¥85.00</td></tr></table><p class="muted">${t('本页所有数据为原型示例')}</p><div class="controls">${button('申请参与','hint','primary')}${button('退出新订单优惠','hint')}</div></div>`;break;
case 8:html+=`<h2>${t('成长运营管理')}</h2><div class="tabs">${button('规则版本','hint')}${button('参与清单','hint')}${button('成长审计','hint')}</div><div class="card"><h3>growth-v1</h3><p>0 / 200 / 1,000 / 3,000 / 8,000</p><div class="row"><span>${t('营销预算')}</span><strong>¥0.00</strong></div><p class="muted">${t('本页所有数据为原型示例')}</p><div class="controls">${button('草稿预览','rules')}${button('提交审批','hint','primary')}</div></div><div class="card tablebox"><table><tr><th>${t('来源')}</th><th>${t('数量')}</th><th>${t('状态')}</th></tr><tr><td>EXAMPLE-001</td><td>+293</td><td>${t('待入账')}</td></tr><tr><td>EXAMPLE-002</td><td>−300</td><td>${t('退款扣回')}</td></tr></table></div>`;break;
case 9:html+=`<div class="tabs">${['服务','商城','手串'].map(x=>`<button data-order-tab="${x}" class="${state.orderTab===x?'chosen':''}">${t(x)}</button>`).join('')}</div><p>${t('全部')} · ${t('待付款')} · ${t('进行中')} · ${t('已完成')}</p>`+Array.from({length:state.more?3:2},(_,i)=>`<article class="card"><div class="row"><small>${t('订单')} EXAMPLE-${i+1}</small><span class="tag">${t('待付款')}</span></div><h3 style="margin-top:16px">${t(state.orderTab)} · ${t('示例项目')}</h3><div class="row"><span>${t('订单金额')} ¥200.00</span>${button('查看详情','order')}</div></article>`).join('')+(state.more?`<p role="status">${t('已全部加载')}</p>`:`<div style="margin-top:24px">${button('加载更多','more','full')}</div>`);break;
case 10:html+=state.editing?`<h2>${t('新增收货地址')}</h2><div class="stack"><label>${t('收货人')}<input id="recipient" value="示例用户" required></label><label>${t('联系电话')}<input id="phone" value="13800000000" inputmode="tel"></label><label>${t('详细地址')}<textarea id="address" rows="3">浙江省杭州市西湖区示例路1号</textarea></label>${button('保存地址','save-address','primary full')}${button('取消','cancel-address')}</div>`:state.addresses.map((a,i)=>`<article class="card"><div class="row"><strong>${t(a.recipient)}</strong>${a.primary?`<span class="tag">${t('默认')}</span>`:''}</div><p>${a.phone}</p><p>${t(a.address)}</p><div class="row"><button data-default-address="${i}">${t('设为默认')}</button><button data-edit-address="${i}">${t('编辑')}</button><button data-delete-address="${i}">${t('删除')}</button></div></article>`).join('')+(state.addresses.length?'':`<p>${t('还没有收货地址')}</p>`)+button('新增收货地址','add-address','primary full');break;
}}
document.getElementById('screen').innerHTML=html;if(state.editing&&state.editIndex!==undefined){const a=state.addresses[state.editIndex];for(const k of ['recipient','phone','address'])document.getElementById(k).value=a[k]}{const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE)$/.test(n.parentElement?.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});while(walker.nextNode()){const n=walker.currentNode;if(!originalText.has(n))originalText.set(n,n.textContent);n.textContent=t(originalText.get(n))}document.querySelectorAll('[placeholder]').forEach(n=>n.placeholder=t(n.placeholder))}}

function hint(){const el=document.getElementById('toast');el.textContent=t('已记录原型操作，不会提交真实业务数据');el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,2500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.orderTab){state.orderTab=b.dataset.orderTab;state.more=false;return render()}if(b.dataset.defaultAddress!==undefined){state.addresses.forEach((a,i)=>a.primary=i===Number(b.dataset.defaultAddress));return render()}if(b.dataset.editAddress!==undefined){state.editing=true;state.editIndex=Number(b.dataset.editAddress);return render()}if(b.dataset.deleteAddress!==undefined){if(confirm(t('确认删除该地址？')))state.addresses.splice(Number(b.dataset.deleteAddress),1);return render()}if(b.dataset.page!==undefined)return nav(Number(b.dataset.page));if(b.dataset.scheme){state.scheme=b.dataset.scheme;return render()}const a=b.dataset.action;if(a==='more'){state.more=true;return render()}if(a==='add-address'){state.editing=true;state.editIndex=undefined;return render()}if(a==='cancel-address'){state.editing=false;return render()}if(a==='save-address'){const value={recipient:document.getElementById('recipient').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),primary:false};if(!value.recipient||!value.address)return;if(state.editIndex!==undefined){value.primary=state.addresses[state.editIndex].primary;state.addresses[state.editIndex]=value}else state.addresses.push(value);state.editing=false;return render()}if(a==='paid'){state.order={...quote(),level:state.level,growthStatus:'pending'};state.status='normal';document.getElementById('state').value='normal'}if(a?.startsWith('task:')){const n=Number(a.split(':')[1]);if(!state.done.has(n)){state.done.add(n);const award=n===0?20:Math.min([20,3,2,20,5][n],200-state.monthlyEarned);state.total+=award;if(n!==0)state.monthlyEarned+=award;state.level=thresholds.filter(x=>state.total>=x).length;document.getElementById('level').value=String(state.level)}hint();render();return}if(a==='refund'){const q=orderSnapshot();if(['cancelled','refunded'].includes(q.growthStatus))return;state.refundPending=q.growthStatus==='pending';state.refundAmount=state.refundPending?0:q.growth;state.total=Math.max(0,state.total-state.refundAmount);state.level=thresholds.filter(x=>state.total>=x).length;state.order={...q,growthStatus:state.refundPending?'cancelled':'refunded'};state.status='refund';document.getElementById('level').value=String(state.level);document.getElementById('state').value='refund';return nav(3)}if(a==='login'||a==='retry'){state.status='normal';document.getElementById('state').value='normal';render();return}const pages={back:0,center:1,tasks:2,records:3,rules:4,checkout:5,order:6,paid:6,orders:9,addresses:10};if(a in pages)nav(pages[a]);else hint()});
for(const id of ['language','theme','level','state'])document.getElementById(id).addEventListener('change',e=>{if(id==='language')state.lang=e.target.value;else if(id==='state'){state.status=e.target.value;if(state.status==='refund'){state.order=null;state.refundAmount=300;state.refundPending=false;state.total=950;state.level=2;document.getElementById('level').value='2'}}else if(id==='level'){state.level=Number(e.target.value);state.total=thresholds[state.level-1]+(state.level===3?250:0);state.scheme='best'}else state.theme=e.target.value;render()});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);render();
