<div class="intro"><h1>无框工作台与轻量导航</h1><p>v2 产品原型 · 全部为示例数据；手串为示意图，实际材质模型以产品验收为准。</p><nav class="switch" aria-label="原型页面"><button data-page="diy" aria-pressed="true">东方珠作</button><button data-page="temple">找寺院</button><button data-page="master">找师傅</button><button data-page="shop">商城</button><button data-page="profile">我的</button><button id="theme" class="quiet">切换深浅色</button></nav></div>
<div id="profile-scenarios" class="intro hidden"><div class="scenario-controls"><label for="profile-scenario">个人页示例状态</label><select id="profile-scenario"><option value="signed">正常已登录 · 示例账号甲</option><option value="guest">游客</option><option value="loading">加载中</option><option value="failed">加载失败</option><option value="alternate">另一个示例账号 · 乙</option></select><p>仅切换本地示例展示；模拟登录与重试不连接真实账号，不发出业务请求。</p></div></div>
<main class="layout"><div class="phone"><header id="title">东方珠作</header>
<section id="diy" class="screen"><div class="stage"><div class="stage-info"><span>我的手串 <small id="count"></small></span><button class="quiet" id="size">手围 16 cm ›</button></div><p id="fit" class="fit"></p><div class="preview"><div class="scene"><svg viewBox="0 0 340 180" aria-label="示意手串，可点击珠子编辑"><ellipse cx="170" cy="90" rx="76" ry="68" fill="none" stroke="#b58e64"/><g id="beads"></g></svg></div><button id="edit" class="edit hidden">编辑珠子</button><div class="tools"><button id="expand">扩大预览</button></div><div class="history"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button></div></div></div><div class="material-panel"><div class="search"><input id="material-search" aria-label="搜索材料" placeholder="搜索材质或规格"><select aria-label="五行"><option>全部五行</option><option>木</option><option>土</option><option>金</option></select></div><div class="browse"><nav class="rail" id="rail" aria-label="材料分类"></nav><div class="materials" id="materials"></div></div></div><footer><strong id="price"></strong><button class="quiet" id="save">保存设计</button><button class="primary" id="customize">去定制 →</button></footer></section>
<section id="directory" class="screen hidden"><div class="belief-anchor"><div id="parents" class="filters" role="group" aria-label="信仰分类"></div><div id="children" class="children hidden" role="group" aria-label="子派别"></div></div><div class="region">全部地区　大陆　香港　澳门　台湾</div><div id="directory-results" class="results"></div></section>
<section id="shop" class="screen hidden"><div class="search shop-search"><input id="shop-search" aria-label="搜索商品" placeholder="搜索商品名称"><button class="quiet" id="search-submit">搜索</button><button class="cart" id="cart" aria-label="购物车，2件商品">购物车 <b>2</b></button></div><div class="filters"><button aria-pressed="true">全部</button><button>手串</button><button>香具</button><button>饰品</button></div><div id="shop-results" class="results"></div><div class="tabs"><span>首页</span><span>对话</span><span>AI问事</span><span class="active">商城</span><span>我的</span></div></section>
<section id="profile" class="screen hidden">
  <div id="profile-member" class="profile-member">
    <div class="account"><h2 id="profile-name">示例用户甲</h2><p id="profile-badge" class="badge">已登录 · 示例账号甲</p><div class="stats"><button id="growth"><b>320</b><span>成长值 ›</span><small>查看成长详情</small></button><button id="points"><b>87</b><span>积分 ›</span><small>查看积分明细</small></button><button id="coupons"><b>0</b><span>优惠券 ›</span><small>查看可用优惠</small></button></div></div>
    <p id="profile-status" class="profile-status" role="status" aria-live="polite"></p><button id="profile-retry" class="quiet profile-retry hidden">重试（示例）</button>
    <button class="row">我的钱包　›</button><button class="row">服务进度　›</button><button class="row">订单中心　›</button><button class="row">收货地址　›</button><div class="notice">成长详情沿用现有五级体系与规则。</div><div style="flex:1"></div>
  </div>
  <div id="profile-guest" class="profile-guest hidden"><h2>问玄东方</h2><p class="badge">未登录 · 游客示例</p><p>登录后查看您的成长、积分和优惠券。</p><button id="profile-login">模拟登录（仅示例）</button><p class="notice">此按钮只恢复示例账号甲，不登录真实账号。</p></div>
  <div class="tabs"><span>首页</span><span>对话</span><span>AI问事</span><span>商城</span><span class="active">我的</span></div>
</section>
</div><aside class="note"><h2 id="note-title"></h2><ol id="notes"></ol><p>示例原型不保存作品、不提交订单，不包含真实账号数据。</p><a href="../../无框DIY与轻量导航产品原型方案.md">查看完整产品规格与验收标准</a></aside></main>
<dialog id="details"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div class="actions"><button class="quiet" id="cancel">关闭</button></div></dialog>
<script>
const $=id=>document.getElementById(id),groups={'汉传佛教':['禅宗','净土宗','天台宗','华严宗'],'藏传佛教':['格鲁派','宁玛派','噶举派','萨迦派'],'南传佛教':['上座部传统'],'道教':['全真派','正一派'],'民间信仰':['妈祖 / 天后','关帝信俗','城隍信俗','王爷信俗','福德正神','保生大帝','哪吒信俗','洪圣信俗','黄大仙信俗','九皇爷信俗','大伯公信俗','拿督公信俗','三山国王']};
const materials=[['小叶紫檀圆珠','主珠',28,'#74382f',10],['星月菩提','主珠',18,'#d8ca94',10],['凤眼菩提','主珠',22,'#9a6a45',10],['白玉圆珠','主珠',35,'#d3d6c6',8],['青金石圆珠','主珠',25,'#1848ac',10],['藏银三通','三通',48,'#8e918b',8],['黄铜隔珠','隔珠',8,'#b9a16a',3],['平安扣吊坠','吊坠',32,'#607b6b',3]];
let current='diy',parent='',child='',opened=false,category='全部',beads=Array.from({length:18},(_,i)=>i%4),selected=-1,history=[],future=[],wrist=160,replace=false;
let profileScenario='signed';
const profileExamples={signed:{name:'示例用户甲',badge:'已登录 · 示例账号甲',values:[320,87,0]},alternate:{name:'示例用户乙',badge:'已登录 · 示例账号乙',values:[1250,46,2]}};
function renderProfile(){
  const guest=profileScenario==='guest',example=profileExamples[profileScenario],pending=profileScenario==='loading';
  $('profile-scenario').value=profileScenario;
  $('profile-member').classList.toggle('hidden',guest);$('profile-guest').classList.toggle('hidden',!guest);
  $('profile-name').textContent=example?.name||'示例用户甲';
  $('profile-badge').textContent=example?.badge||(pending?'示例账号甲 · 加载中':guest?'游客示例':'示例账号甲 · 加载失败');
  for(const [i,id] of ['growth','points','coupons'].entries()){
    $(id).querySelector('b').textContent=example?String(example.values[i]):'—';
    $(id).querySelector('small').textContent=example?['查看成长详情','查看积分明细','查看可用优惠'][i]:pending?'正在加载…':'暂未获取';
  }
  $('profile-status').textContent=pending?'正在获取账户数据…（示例状态，不会发送请求）':profileScenario==='failed'?'账户数据暂未获取，请重试。失败不代表数值为零。':'';
  $('profile-status').classList.toggle('hidden',!pending&&profileScenario!=='failed');
  $('profile-retry').classList.toggle('hidden',profileScenario!=='failed');
}
function selectProfileScenario(value){
  if(!['signed','guest','loading','failed','alternate'].includes(value))return;
  profileScenario=value;renderProfile();
}
function profileDetail(kind){
  const title={growth:'成长详情',points:'积分中心',coupons:'优惠券'}[kind],example=profileExamples[profileScenario];
  if(!example){modal(title,profileScenario==='loading'?'正在加载…（本地示例，不发出业务请求）':'暂未获取账户数据。请关闭详情并使用“重试（示例）”。');return;}
  const [growth,points,coupons]=example.values;
  modal(title+' · '+example.name,kind==='growth'?'示例成长值 '+growth+'。正式产品展示当前等级、距下一级进度、权益范围及成长记录，所有规则以服务端为准。':kind==='points'?'示例积分 '+points+'，独立于成长值使用。':coupons?'示例账号有 '+coupons+' 张可用优惠券。':'示例账号暂无可用优惠券。');
}
function btn(text,active,action){const b=document.createElement('button');b.textContent=text;b.setAttribute('aria-pressed',String(active));b.onclick=action;return b}
function modal(title,content){$('dialog-title').textContent=title;$('dialog-content').replaceChildren();if(typeof content==='string')$('dialog-content').textContent=content;else $('dialog-content').append(content);$('details').showModal()}
function change(next){history.push([...beads]);future=[];beads=next;renderDiy()}
function renderDiy(){const sum=beads.reduce((s,i)=>s+materials[i][4],0),mean=beads.length?sum/beads.length:0,inner=Math.max(0,sum-Math.PI*mean),diff=inner-wrist-8;$('count').textContent=beads.length+' / 60 颗';$('price').textContent='¥ '+beads.reduce((s,i)=>s+materials[i][2],0).toFixed(2);$('size').textContent='手围 '+(wrist/10).toFixed(1)+' cm ›';$('fit').textContent='内围预估 '+(inner/10).toFixed(1)+' cm · '+(!beads.length?'未开始':diff < -8?'偏短，还差约 '+Math.round(-diff)+' mm':diff>8?'偏长，偏松约 '+Math.round(diff)+' mm':'接近合适');$('undo').disabled=!history.length;$('redo').disabled=!future.length;$('edit').classList.toggle('hidden',selected<0||selected>=beads.length);$('beads').replaceChildren(...beads.map((m,i)=>{const a=i*2*Math.PI/Math.max(beads.length,1)-Math.PI/2,c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',170+76*Math.cos(a));c.setAttribute('cy',90+68*Math.sin(a));c.setAttribute('r',materials[m][4]*.85+2);c.setAttribute('fill',materials[m][3]);c.setAttribute('stroke',i===selected?'var(--accent)':'#0002');c.setAttribute('stroke-width',i===selected?3:1);c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label','第 '+(i+1)+' 颗 '+materials[m][0]);c.onclick=()=>{selected=i;renderDiy()};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=i;renderDiy()}};return c}));$('rail').replaceChildren(...['全部','正在使用','主珠','隔珠','佛头','三通','吊坠','流苏','绳线'].map(c=>btn(c,c===category,()=>{category=c;renderDiy()})));$('materials').replaceChildren(...materials.flatMap((m,i)=>{if(category==='正在使用'?!beads.includes(i):category!=='全部'&&m[1]!==category)return[];if(!m[0].includes($('material-search').value))return[];const b=document.createElement('button');b.className='material';b.innerHTML='<span class="bead" style="background:'+m[3]+'"></span><strong>'+m[0]+'</strong><small>'+m[4]+'mm</small><b>¥'+m[2].toFixed(2)+'　＋</b>';b.onclick=()=>{if(replace&&selected>=0){const next=[...beads];next[selected]=i;replace=false;change(next)}else if(beads.length<60)change([...beads,i])};return[b]}))}
function closeChildren(focus=false){opened=false;renderDirectory();if(focus)$('parents').querySelector('[aria-pressed="true"]')?.focus()}
function renderDirectory(){$('parents').replaceChildren(...['',...Object.keys(groups)].map(name=>{const b=btn(name||'全部',name===parent,()=>{if(parent!==name)child='';opened=name?(parent===name?!opened:true):false;parent=name;renderDirectory()});if(name)b.setAttribute('aria-expanded',String(name===parent&&opened));return b}));$('children').classList.toggle('hidden',!opened);$('children').replaceChildren(...(parent?['',...groups[parent]].map(name=>btn(name||'全部'+parent,name===child,()=>{child=name;closeChildren(true)})):[]));$('directory-results').innerHTML='<div class="card"><h3>示例'+(current==='master'?'师傅':'寺院')+'</h3><p>'+ (parent||'全部类型')+(child?' · '+child:'')+'</p><p>下方筛选与结果保持原位置</p></div>'}
const notes={diy:['手串直接位于上半部，没有工作台外框。','工具上下各有保留区域；点击珠子显示编辑入口。','长度估算常显；点击手围可调目标大小。','可体验替换、删除、撤销重做、已用筛选及扩大预览。'],temple:['点击五类标签打开子派别悬浮层，无动画。','地区与结果不挤动；选择、外点或 Escape 关闭。','层内选择保留；切换父类型清除原子项。'],shop:['内容区不重复显示商城标题。','购物车与搜索同行，数量和入口保留。','输入商品名称后点击搜索体验列表筛选。'],profile:['成长值位于积分左侧，三项同规格对齐。','点击成长值查看等级、权益和记录的详情入口。','不再出现独立我的成长横卡。']};
function show(name){current=name;opened=false;$('profile-scenarios').classList.toggle('hidden',name!=='profile');if(name==='profile')renderProfile();for(const id of ['diy','directory','shop','profile'])$(id).classList.toggle('hidden',id!==(name==='temple'||name==='master'?'directory':name));$('title').textContent={diy:'东方珠作',temple:'找寺院',master:'找师傅',shop:'问玄东方',profile:'问玄东方'}[name];document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===name)));$('note-title').textContent={diy:'围绕手串完成设计',temple:'浮层筛选，列表不动',master:'同一套目录交互',shop:'搜索与购物车同排',profile:'成长与积分并列'}[name];$('notes').replaceChildren(...(notes[name]||notes.temple).map(t=>{const li=document.createElement('li');li.textContent=t;return li}));renderDirectory()}
function shop(){const q=$('shop-search').value;$('shop-results').innerHTML=['星月菩提手串','青金石手串','东方香具'].filter(n=>n.includes(q)).map((n,i)=>'<div class="card"><div class="product-art"><span class="bead" style="background:'+materials[i][3]+'"></span></div><h3>'+n+'</h3><p>示例商品 · ¥128</p></div>').join('')||'<p>没有匹配的商品</p>'}
$('undo').onclick=()=>{future.push([...beads]);beads=history.pop();selected=-1;renderDiy()};$('redo').onclick=()=>{history.push([...beads]);beads=future.pop();selected=-1;renderDiy()};$('expand').onclick=()=>{const on=$('diy').classList.toggle('expanded');$('expand').textContent=on?'收起预览':'扩大预览'};$('material-search').oninput=renderDiy;$('edit').onclick=()=>{const box=document.createElement('div');for(const [label,action] of [['替换材料',()=>{replace=true;category='全部';renderDiy()}],['复制',()=>{if(beads.length<60)change([...beads.slice(0,selected+1),beads[selected],...beads.slice(selected+1)])}],['删除',()=>{change(beads.filter((_,i)=>i!==selected));selected=-1;renderDiy()}]]){const b=btn(label,false,()=>{$('details').close();action()});box.append(b)}modal(materials[beads[selected]][0],box)};$('size').onclick=()=>{const box=document.createElement('div');box.textContent='手围 14–20cm，松量 8mm。估算仅作设计参考。';const input=document.createElement('input');input.type='range';input.min=140;input.max=200;input.step=5;input.value=wrist;input.setAttribute('aria-label','手围毫米');input.oninput=()=>{wrist=Number(input.value);renderDiy()};box.append(input);modal('手围与松量',box)};
$('cancel').onclick=()=>$('details').close();$('save').onclick=()=>modal('保存设计','正式产品需登录后云端保存。此原型未上传或暂存作品。');$('customize').onclick=()=>modal('去定制','正式产品会校验设计、库存和收货信息后进入定制。原型不创建订单。');$('growth').onclick=()=>profileDetail('growth');$('points').onclick=()=>profileDetail('points');$('coupons').onclick=()=>profileDetail('coupons');$('profile-scenario').onchange=e=>selectProfileScenario(e.target.value);$('profile-login').onclick=()=>{selectProfileScenario('signed');$('growth').focus()};$('profile-retry').onclick=()=>{selectProfileScenario('signed');$('growth').focus()};$('cart').onclick=()=>modal('购物车','示例购物车有 2 件商品，正式产品进入独立购物车页。');$('search-submit').onclick=shop;$('shop-search').onkeydown=e=>{if(e.key==='Enter')shop()};$('theme').onclick=()=>document.body.classList.toggle('dark');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.addEventListener('pointerdown',e=>{if(opened&&!e.target.closest('.belief-anchor'))closeChildren()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened)closeChildren(true)});show('diy');renderDiy();shop();
</script></html>
